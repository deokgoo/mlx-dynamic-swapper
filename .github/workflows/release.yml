name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos-arm64:
    name: Build macOS Apple Silicon (arm64)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-swapper

      - name: Build release binary
        run: |
          cd rust-swapper
          cargo build --release --target aarch64-apple-darwin

      - name: Package binary
        run: |
          mkdir -p release-pkg
          cp rust-swapper/target/aarch64-apple-darwin/release/mlx-swapper release-pkg/
          cp bin/mlx release-pkg/
          cp config.example.toml release-pkg/
          cp ai.mlx.server.plist.template release-pkg/
          cd release-pkg
          tar -czvf ../mlx-swapper-aarch64-apple-darwin.tar.gz *

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: mlx-swapper-aarch64-apple-darwin.tar.gz
          draft: false
          prerelease: false
          generate_release_notes: true
